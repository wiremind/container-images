name: Build with Bake

on:
  push:
    branches:
      - main
    paths:
      - "images/**"
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.changes.outputs.images }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed images
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger: build all images
            IMAGES=$(ls -d images/*/ 2>/dev/null | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            # Push trigger: only changed images
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- images/ | cut -d/ -f2 | sort -u)
            IMAGES=$(echo "$CHANGED" | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi

          if [ "$IMAGES" = "[]" ] || [ -z "$IMAGES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "images=[]" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "images=$IMAGES" >> $GITHUB_OUTPUT
            echo "Images to build: $IMAGES"
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect-changes.outputs.images) }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get build metadata
        id: metadata
        run: |
          # Get metadata from last commit that modified this image
          read -r REVISION SOURCE_DATE_EPOCH <<< "$(git log -1 --format='%H %ct' -- images/${{ matrix.image }})"
          echo "revision=$REVISION" >> $GITHUB_OUTPUT
          echo "epoch=$SOURCE_DATE_EPOCH" >> $GITHUB_OUTPUT

          # ISO 8601 timestamp for OCI labels (derived from SOURCE_DATE_EPOCH)
          CREATED=$(date -u -d @$SOURCE_DATE_EPOCH +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -r $SOURCE_DATE_EPOCH +%Y-%m-%dT%H:%M:%SZ)
          echo "created=$CREATED" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to DHI
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push ${{ matrix.image }}
        id: bake
        uses: docker/bake-action@v7
        env:
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.epoch }}
        with:
          source: ./images/${{ matrix.image }}
          files: docker-bake.hcl
          push: true
          pull: true
          # NB: provenance and sbom are causing "unknown/unknown" images, just cosmetic. Non-issue.
          provenance: "mode=max,version=v1"
          sbom: true
          set: |
            *.cache-from=type=gha,scope=${{ matrix.image }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.image }}
            *.output=type=image,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
            *.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            *.labels.org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            *.labels.org.opencontainers.image.revision=${{ steps.metadata.outputs.revision }}
            *.labels.org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
            *.labels.org.opencontainers.image.title=${{ matrix.image }}
            *.labels.org.opencontainers.image.vendor=Wiremind
            *.labels.org.opencontainers.image.licenses=MIT
            *.labels.org.opencontainers.image.ref.name=${{ github.ref_name }}
            *.labels.org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
            *.annotations.index,manifest:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            *.annotations.index,manifest:org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            *.annotations.index,manifest:org.opencontainers.image.revision=${{ steps.metadata.outputs.revision }}
            *.annotations.index,manifest:org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
            *.annotations.index,manifest:org.opencontainers.image.title=${{ matrix.image }}
            *.annotations.index,manifest:org.opencontainers.image.vendor=Wiremind
            *.annotations.index,manifest:org.opencontainers.image.licenses=MIT
            *.annotations.index,manifest:org.opencontainers.image.ref.name=${{ github.ref_name }}
            *.annotations.index,manifest:org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme

      - name: Sign images with Cosign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |-
          METADATA='${{ steps.bake.outputs.metadata }}'

          echo "$METADATA" | jq -r '
            to_entries[] |
            select(.value["containerimage.digest"]) |
            .value["containerimage.digest"] as $digest |
            (.value["image.name"] | split(",")[]) |
            "\(.)@\($digest)"
          ' | while read -r image_ref; do
            echo "Signing: $image_ref"
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
              -a "repo=${{ github.server_url }}/${{ github.repository }}" \
              -a "ref=${{ github.ref }}" \
              -a "sha=${{ github.sha }}" \
              "$image_ref"
          done
