name: Build with Bake

on:
  push:
    branches:
      - main
    paths:
      - "images/**"
      - ".envrc"
  pull_request:
    paths:
      - "images/**"
      - ".envrc"
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.changes.outputs.images }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed images
        id: changes
        run: |
          # Helper: list all images
          all_images() {
            ls -d images/*/ 2>/dev/null | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(length > 0))'
          }

          REF_SHA=$( [ "${{ github.event_name }}" = "pull_request" ] && echo "${{ github.event.pull_request.base.sha }}" || echo "${{ github.event.before }}" )
          ALL_CHANGED=$(git diff --name-only ${REF_SHA}...HEAD)
          ENVRC_CHANGED=$(echo "$ALL_CHANGED" | grep -E '^\.envrc$' || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -n "$ENVRC_CHANGED" ]; then
            # Manual trigger or .envrc changed: build all images
            IMAGES=$(all_images)
          else
            # Push trigger: diff against baseref and extract changed images
            CHANGED=$(echo "$ALL_CHANGED" | grep '^images/' | cut -d/ -f2 | sort -u)
            IMAGES=$(echo "$CHANGED" | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi

          if [ "$IMAGES" = "[]" ] || [ -z "$IMAGES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "images=[]" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "images=$IMAGES" >> $GITHUB_OUTPUT
            echo "Images to build: $IMAGES"
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect-changes.outputs.images) }}
        arch:
          - runner: ubuntu-24.04
            platform: linux/amd64
            slug: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            slug: arm64

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if platform is supported
        id: check-platform
        run: |
          # Check if this image's bake config includes this platform
          BAKE_FILE="images/${{ matrix.image }}/docker-bake.hcl"

          if grep -q '${{ matrix.arch.platform }}' "$BAKE_FILE"; then
            echo "supported=true" >> $GITHUB_OUTPUT
          else
            echo "supported=false" >> $GITHUB_OUTPUT
            echo "::notice::Image ${{ matrix.image }} does not support ${{ matrix.arch.platform }}, skipping"
          fi

      - name: Get build metadata
        if: steps.check-platform.outputs.supported == 'true'
        id: metadata
        run: |
          # Get metadata from last commit that modified this image
          read -r REVISION SOURCE_DATE_EPOCH <<< "$(git log -1 --format='%H %ct' -- images/${{ matrix.image }})"
          echo "revision=$REVISION" >> $GITHUB_OUTPUT
          echo "epoch=$SOURCE_DATE_EPOCH" >> $GITHUB_OUTPUT

          # ISO 8601 timestamp for OCI labels (derived from SOURCE_DATE_EPOCH)
          CREATED=$(date -u -d @$SOURCE_DATE_EPOCH +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -r $SOURCE_DATE_EPOCH +%Y-%m-%dT%H:%M:%SZ)
          echo "created=$CREATED" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: steps.check-platform.outputs.supported == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: steps.check-platform.outputs.supported == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.check-platform.outputs.supported == 'true'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to DHI
        if: steps.check-platform.outputs.supported == 'true'
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Load shared environment variables
        if: steps.check-platform.outputs.supported == 'true'
        uses: HatsuneMiku3939/direnv-action@v1.1.5

      - name: Transform bake config with per-commit platform tags
        if: steps.check-platform.outputs.supported == 'true'
        id: bake-transform
        working-directory: ./images/${{ matrix.image }}
        run: |
          if ! docker buildx bake -f docker-bake.hcl --print > bake-original.json; then
            echo "::error::Failed to parse docker-bake.hcl"
            exit 1
          fi

          SHA="${{ github.sha }}"

          # Save original tags for the merge step
          jq -r '.target[].tags[]?' bake-original.json | sort -u > original-tags.txt
          echo "Original tags:"
          cat original-tags.txt

          # Transform: replace each tag with a per-commit platform-specific tag
          # e.g. ghcr.io/wiremind/haproxy:2.8.20-debian13
          #   -> ghcr.io/wiremind/haproxy:2.8.20-debian13-<sha>-amd64
          jq --arg suffix "-${SHA}-${{ matrix.arch.slug }}" '
            .target |= with_entries(
              .value.tags |= (if . then map(. + $suffix) else . end)
            )
          ' bake-original.json > bake-platform.json

          echo "Transformed tags:"
          jq -r '.target[].tags[]?' bake-platform.json

      - name: Build and push ${{ matrix.image }} (${{ matrix.arch.platform }})
        if: steps.check-platform.outputs.supported == 'true'
        uses: docker/bake-action@v7
        env:
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.epoch }}
        with:
          source: ./images/${{ matrix.image }}
          files: bake-platform.json
          pull: true
          # In multi-native build, hassle to handle. Disable them for now.
          provenance: false
          sbom: false
          set: |
            *.platform=${{ matrix.arch.platform }}
            *.output=type=image,push=${{ github.event_name != 'pull_request' }},oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
            *.cache-from=type=gha,scope=${{ matrix.image }}-${{ matrix.arch.slug }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch.slug }}
            *.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            *.labels.org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            *.labels.org.opencontainers.image.revision=${{ steps.metadata.outputs.revision }}
            *.labels.org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
            *.labels.org.opencontainers.image.title=${{ matrix.image }}
            *.labels.org.opencontainers.image.vendor=Wiremind
            *.labels.org.opencontainers.image.licenses=MIT
            *.labels.org.opencontainers.image.ref.name=${{ github.ref_name }}
            *.labels.org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme

      - name: Upload original tags
        # Only upload once per image (both platforms produce the same tag list)
        if: steps.check-platform.outputs.supported == 'true' && github.event_name != 'pull_request' && matrix.arch.slug == 'amd64'
        uses: actions/upload-artifact@v6
        with:
          name: tags-${{ matrix.image }}
          path: images/${{ matrix.image }}/original-tags.txt
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    needs:
      - detect-changes
      - build
    if: needs.detect-changes.outputs.has_changes == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect-changes.outputs.images) }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Download tag artifacts
        id: download
        uses: actions/download-artifact@v6
        with:
          name: tags-${{ matrix.image }}
          path: tags
        continue-on-error: true

      - name: Check for tags
        id: check-tags
        run: |
          if [ ! -d tags ] || [ -z "$(ls -A tags 2>/dev/null)" ]; then
            echo "::notice::No tag artifacts found for ${{ matrix.image }}, skipping manifest creation"
            echo "has_tags=false" >> $GITHUB_OUTPUT
          else
            echo "has_tags=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Cosign
        if: steps.check-tags.outputs.has_tags == 'true'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Set up Docker Buildx
        if: steps.check-tags.outputs.has_tags == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: steps.check-tags.outputs.has_tags == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        if: steps.check-tags.outputs.has_tags == 'true'
        id: manifest
        run: |
          SHA="${{ github.sha }}"
          MANIFEST_REFS=""

          # Deduplicate tags across platform artifacts (both platforms produce the same list)
          sort -u tags/original-tags.txt > all-tags.txt

          echo "Tags to create multi-arch manifests for:"
          cat all-tags.txt

          while read -r tag; do
            [ -z "$tag" ] && continue

            AMD64_REF="${tag}-${SHA}-amd64"
            ARM64_REF="${tag}-${SHA}-arm64"

            # Check which platform images exist
            SOURCES=""
            for ref in "$AMD64_REF" "$ARM64_REF"; do
              if docker buildx imagetools inspect "$ref" > /dev/null 2>&1; then
                SOURCES="$SOURCES $ref"
              else
                echo "::notice::Platform image not found: $ref (image may not support this platform)"
              fi
            done

            if [ -z "$SOURCES" ]; then
              echo "::warning::No platform images found for $tag, skipping"
              continue
            fi

            echo "Creating manifest: $tag from:$SOURCES"
            if docker buildx imagetools create -t "$tag" $SOURCES; then
              echo "Created: $tag"
              MANIFEST_DIGEST=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')
              MANIFEST_REFS="$MANIFEST_REFS ${tag}@${MANIFEST_DIGEST}"
            else
              echo "::error::Failed to create manifest for $tag"
            fi
          done < all-tags.txt

          echo "manifest_refs=$MANIFEST_REFS" >> $GITHUB_OUTPUT

      - name: Sign manifests with Cosign
        if: steps.check-tags.outputs.has_tags == 'true' && steps.manifest.outputs.manifest_refs != ''
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |-
          SIGN_FAILED=0
          MANIFEST_REFS="${{ steps.manifest.outputs.manifest_refs }}"
          for manifest_ref in $MANIFEST_REFS; do
            [ -z "$manifest_ref" ] && continue
            echo "Signing manifest: $manifest_ref"

            if cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
              -a "repo=${{ github.server_url }}/${{ github.repository }}" \
              -a "ref=${{ github.ref }}" \
              -a "sha=${{ github.sha }}" \
              "$manifest_ref"; then
              echo "Signed: $manifest_ref"
            else
              echo "::warning::Failed to sign $manifest_ref"
              SIGN_FAILED=1
            fi
          done

          if [ "$SIGN_FAILED" -eq 1 ]; then
            echo "::warning::Some manifests failed to sign"
          fi
