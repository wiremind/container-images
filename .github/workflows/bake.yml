name: Build with Bake

on:
  push:
    branches:
      - main
    paths:
      - "images/**"
      - ".envrc"
  pull_request:
    paths:
      - "images/**"
      - ".envrc"
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.changes.outputs.images }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed images
        id: changes
        run: |
          # Helper: list all images
          all_images() {
            ls -d images/*/ 2>/dev/null | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(length > 0))'
          }

          REF_SHA=$( [ "${{ github.event_name }}" = "pull_request" ] && echo "${{ github.event.pull_request.base.sha }}" || echo "${{ github.event.before }}" )
          ALL_CHANGED=$(git diff --name-only ${REF_SHA}...HEAD)
          ENVRC_CHANGED=$(echo "$ALL_CHANGED" | grep -E '^\.envrc$' || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -n "$ENVRC_CHANGED" ]; then
            # Manual trigger or .envrc changed: build all images
            IMAGES=$(all_images)
          else
            # Push trigger: diff against baseref and extract changed images
            CHANGED=$(echo "$ALL_CHANGED" | grep '^images/' | cut -d/ -f2 | sort -u)
            IMAGES=$(echo "$CHANGED" | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi

          if [ "$IMAGES" = "[]" ] || [ -z "$IMAGES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "images=[]" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "images=$IMAGES" >> $GITHUB_OUTPUT
            echo "Images to build: $IMAGES"
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect-changes.outputs.images) }}
        arch:
          - runner: ubuntu-24.04
            platform: linux/amd64
            slug: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            slug: arm64

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if platform is supported
        id: check-platform
        run: |
          # Check if this image's bake config includes this platform
          BAKE_FILE="images/${{ matrix.image }}/docker-bake.hcl"

          if grep -q '${{ matrix.arch.platform }}' "$BAKE_FILE"; then
            echo "supported=true" >> $GITHUB_OUTPUT
          else
            echo "supported=false" >> $GITHUB_OUTPUT
            echo "::notice::Image ${{ matrix.image }} does not support ${{ matrix.arch.platform }}, skipping"
          fi

      - name: Get build metadata
        if: steps.check-platform.outputs.supported == 'true'
        id: metadata
        run: |
          # Get metadata from last commit that modified this image
          read -r REVISION SOURCE_DATE_EPOCH <<< "$(git log -1 --format='%H %ct' -- images/${{ matrix.image }})"
          echo "revision=$REVISION" >> $GITHUB_OUTPUT
          echo "epoch=$SOURCE_DATE_EPOCH" >> $GITHUB_OUTPUT

          # ISO 8601 timestamp for OCI labels (derived from SOURCE_DATE_EPOCH)
          CREATED=$(date -u -d @$SOURCE_DATE_EPOCH +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -r $SOURCE_DATE_EPOCH +%Y-%m-%dT%H:%M:%SZ)
          echo "created=$CREATED" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: steps.check-platform.outputs.supported == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: steps.check-platform.outputs.supported == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.check-platform.outputs.supported == 'true'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to DHI
        if: steps.check-platform.outputs.supported == 'true'
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Load shared environment variables
        if: steps.check-platform.outputs.supported == 'true'
        uses: HatsuneMiku3939/direnv-action@v1.1.5

      - name: Build and push ${{ matrix.image }} (${{ matrix.arch.platform }})
        if: steps.check-platform.outputs.supported == 'true'
        id: bake
        uses: docker/bake-action@v7
        env:
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.epoch }}
        with:
          source: ./images/${{ matrix.image }}
          files: docker-bake.hcl
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          provenance: "mode=max,version=v1"
          sbom: true
          set: |
            *.platform=${{ matrix.arch.platform }}
            *.output=type=image,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true
            *.cache-from=type=gha,scope=${{ matrix.image }}-${{ matrix.arch.slug }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch.slug }}
            *.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            *.labels.org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            *.labels.org.opencontainers.image.revision=${{ steps.metadata.outputs.revision }}
            *.labels.org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
            *.labels.org.opencontainers.image.title=${{ matrix.image }}
            *.labels.org.opencontainers.image.vendor=Wiremind
            *.labels.org.opencontainers.image.licenses=MIT
            *.labels.org.opencontainers.image.ref.name=${{ github.ref_name }}
            *.labels.org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme

      - name: Extract digest mapping
        if: steps.check-platform.outputs.supported == 'true' && github.event_name != 'pull_request'
        id: digests
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          # Create digest file: one line per "tag digest" pair
          # Use printenv to avoid "Argument list too long" with large metadata
          printenv METADATA | jq -r '
            to_entries[] |
            select(.value["containerimage.digest"] and .value["image.name"]) |
            .value["containerimage.digest"] as $digest |
            (.value["image.name"] | split(",")[]) |
            "\(.) \($digest)"
          ' | sort -u > digests-${{ matrix.arch.slug }}.txt

          echo "Generated digest mapping:"
          cat digests-${{ matrix.arch.slug }}.txt

      - name: Upload digest artifact
        if: steps.check-platform.outputs.supported == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch.slug }}
          path: digests-${{ matrix.arch.slug }}.txt
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    needs:
      - detect-changes
      - build
    if: needs.detect-changes.outputs.has_changes == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect-changes.outputs.images) }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Download digest artifacts
        id: download
        uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: digests
        continue-on-error: true

      - name: Check for digests
        id: check-digests
        run: |
          if [ ! -d digests ] || [ -z "$(ls -A digests 2>/dev/null)" ]; then
            echo "::notice::No digest artifacts found for ${{ matrix.image }}, skipping manifest creation"
            echo "has_digests=false" >> $GITHUB_OUTPUT
          else
            echo "has_digests=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Cosign
        if: steps.check-digests.outputs.has_digests == 'true'
        uses: sigstore/cosign-installer@v4.1.1

      - name: Set up Docker Buildx
        if: steps.check-digests.outputs.has_digests == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: steps.check-digests.outputs.has_digests == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.check-digests.outputs.has_digests == 'true'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to DHI
        if: steps.check-digests.outputs.has_digests == 'true'
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Create multi-arch manifests
        if: steps.check-digests.outputs.has_digests == 'true'
        id: manifest
        run: |
          # Collect all digest files
          echo "Available digest files:"
          ls -la digests/

          # Build mapping: tag -> [digests]
          declare -A TAG_DIGESTS

          for digest_file in digests/digests-*.txt; do
            [ -f "$digest_file" ] || continue
            echo "Processing: $digest_file"
            while IFS=' ' read -r tag digest; do
              [ -z "$tag" ] && continue
              # Append digest to tag's list (space-separated)
              TAG_DIGESTS["$tag"]="${TAG_DIGESTS[$tag]} $digest"
            done < "$digest_file"
          done

          # Create manifest for each tag
          MANIFEST_REFS=""
          for tag in "${!TAG_DIGESTS[@]}"; do
            digests="${TAG_DIGESTS[$tag]}"
            # Trim leading space and dedupe
            digests=$(echo "$digests" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')

            echo "Creating manifest for $tag with index digests: $digests"

            # Extract registry/repo from tag
            REPO=$(echo "$tag" | cut -d: -f1)

            # With SBOM/provenance, each digest points to a manifest INDEX.
            # We need to extract the actual platform manifests from each index.
            PLATFORM_REFS=""
            for d in $digests; do
              INDEX_REF="${REPO}@${d}"
              echo "Extracting platform manifests from index: $INDEX_REF"

              # Get all platform manifests from this index (excludes attestations)
              PLATFORMS=$(docker buildx imagetools inspect "$INDEX_REF" --format '{{range .Manifest.Manifests}}{{if .Platform.OS}}{{.Digest}} {{end}}{{end}}')

              for p in $PLATFORMS; do
                [ -z "$p" ] && continue
                PLATFORM_REFS="$PLATFORM_REFS ${REPO}@${p}"
                echo "  Found platform manifest: ${REPO}@${p}"
              done
            done

            if [ -z "$PLATFORM_REFS" ]; then
              echo "::warning::No platform manifests found for $tag, skipping"
              continue
            fi

            echo "Creating multi-arch manifest for $tag from:$PLATFORM_REFS"
            if docker buildx imagetools create -t "$tag" $PLATFORM_REFS; then
              echo "Created manifest: $tag"
              # Get the manifest digest for signing
              MANIFEST_DIGEST=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')
              MANIFEST_REFS="$MANIFEST_REFS ${tag}@${MANIFEST_DIGEST}"
            else
              echo "::error::Failed to create manifest for $tag"
            fi
          done

          # Output manifest refs for signing
          echo "manifest_refs=$MANIFEST_REFS" >> $GITHUB_OUTPUT

      - name: Sign manifests with Cosign
        if: steps.check-digests.outputs.has_digests == 'true' && steps.manifest.outputs.manifest_refs != ''
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |-
          SIGN_FAILED=0
          MANIFEST_REFS="${{ steps.manifest.outputs.manifest_refs }}"
          for manifest_ref in $MANIFEST_REFS; do
            [ -z "$manifest_ref" ] && continue
            echo "Signing manifest: $manifest_ref"

            if cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
              -a "repo=${{ github.server_url }}/${{ github.repository }}" \
              -a "ref=${{ github.ref }}" \
              -a "sha=${{ github.sha }}" \
              "$manifest_ref"; then
              echo "Signed: $manifest_ref"
            else
              echo "::warning::Failed to sign $manifest_ref"
              SIGN_FAILED=1
            fi
          done

          if [ "$SIGN_FAILED" -eq 1 ]; then
            echo "::warning::Some manifests failed to sign"
          fi
